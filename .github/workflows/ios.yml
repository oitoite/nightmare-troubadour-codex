name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core package tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Packages/NTCodexCore
        run: swift test

  app-build:
    name: App build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort | tail -1)"
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project NTCodex.xcodeproj -scheme NTCodex \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            build | xcpretty && exit ${PIPESTATUS[0]}
      - name: Core tests via Xcode
        working-directory: ios/Packages/NTCodexCore
        run: xcodebuild -scheme NTCodexCore -destination 'platform=macOS' test | xcpretty && exit ${PIPESTATUS[0]}
