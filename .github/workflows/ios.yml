name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core package tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Packages/NTCodexCore
        run: swift test

  app-build:
    name: App build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcrun simctl list runtimes | head -20
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project NTCodex.xcodeproj -scheme NTCodex \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation build
      - name: Core tests via Xcode
        working-directory: ios/Packages/NTCodexCore
        run: xcodebuild -scheme NTCodexCore -destination 'platform=macOS' test
